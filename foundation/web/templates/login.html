<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0F1821;--steel:#3E6B8A;--copper:#B4653A;--fail:#A32B28}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--ink);overflow:hidden}
  #bg{position:fixed;inset:0}
  .veil{position:fixed;inset:0;background:
    radial-gradient(120% 90% at 50% 45%, rgba(15,24,33,0) 0%, rgba(15,24,33,.72) 62%, rgba(15,24,33,.95) 100%)}
  .stage{position:relative;height:100%;display:grid;place-items:center;padding:20px}
  .card-wrap{position:relative;width:min(360px,92vw)}
  /* ربات روی لبه بالای کادر می‌نشیند */
  #robot{
    position:absolute;inset-block-start:-118px;inset-inline-start:50%;
    transform:translateX(50%);
    width:200px;height:150px;pointer-events:auto;cursor:pointer;
    filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));
    opacity:0;animation:pop 1s cubic-bezier(.2,.9,.3,1) .5s forwards;
  }
  @keyframes pop{from{opacity:0;transform:translateX(50%) translateY(12px) scale(.92)}
                 to{opacity:1;transform:translateX(50%) translateY(0) scale(1)}}

  form{
    width:100%;
    background:rgba(20,30,40,.72);
    backdrop-filter:blur(14px) saturate(1.1);
    border:1px solid rgba(160,190,210,.16);
    border-radius:3px;
    padding:34px 30px 30px;
    box-shadow:0 30px 70px rgba(0,0,0,.45);
    opacity:0;transform:translateY(14px);
    animation:rise .9s cubic-bezier(.2,.8,.3,1) .25s forwards;
  }
  @keyframes rise{to{opacity:1;transform:none}}

  /* نشان: مقطع پی و ستون، با همان زبان نقشه */
  .mark{display:block;margin:0 auto 24px;width:64px;height:40px}
  .mark path,.mark line{fill:none;stroke:#8FB0C6;stroke-width:1.4;
    stroke-dasharray:160;stroke-dashoffset:160;animation:draw 1.6s ease .5s forwards}
  .mark .hot{stroke:var(--copper);animation-delay:1.1s}
  @keyframes draw{to{stroke-dashoffset:0}}

  .f{margin-bottom:12px}
  label{display:block;font-size:12px;color:#8095A5;margin-bottom:5px}
  input{
    width:100%;padding:10px 12px;font:inherit;font-size:14px;color:#EAF1F6;
    background:rgba(10,17,24,.65);border:1px solid rgba(160,190,210,.2);
    border-radius:2px;transition:border-color .2s,background .2s;
  }
  input:focus{outline:none;border-color:var(--steel);background:rgba(10,17,24,.9)}
  button{
    width:100%;margin-top:8px;padding:11px;font:inherit;font-weight:600;font-size:15px;
    color:#fff;background:var(--copper);border:0;border-radius:2px;cursor:pointer;
    transition:background .2s,transform .08s;
  }
  button:hover{background:#9C5530}
  button:active{transform:translateY(1px)}
  .err{margin:0 0 14px;padding:9px 12px;font-size:13px;color:#F0C9C6;
    background:rgba(163,43,40,.18);border-inline-start:2px solid var(--fail)}
  @media (prefers-reduced-motion:reduce){
    form{animation:none;opacity:1;transform:none}
    .mark path,.mark line{animation:none;stroke-dashoffset:0}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="veil"></div>

<div class="stage">
 <div class="card-wrap">
  <canvas id="robot"></canvas>
  <form method="post" id="card">
  {{ csrf_field() }}
    <svg class="mark" viewBox="0 0 64 40" aria-hidden="true">
      <line x1="4" y1="30" x2="60" y2="30"/>
      <line x1="10" y1="30" x2="54" y2="30" class="hot"/>
      <path d="M10 30 V24 H54 V30"/>
      <path d="M26 24 V8 H38 V24"/>
      <line x1="29" y1="8" x2="29" y2="3" class="hot"/>
      <line x1="35" y1="8" x2="35" y2="3" class="hot"/>
    </svg>

    {% with msgs = get_flashed_messages() %}
      {% for m in msgs %}<p class="err">{{ m }}</p>{% endfor %}
    {% endwith %}

    <div class="f"><label>نام کاربری</label><input name="username" autofocus required></div>
    <div class="f"><label>رمز عبور</label><input name="password" type="password" required></div>
    <button type="submit">ورود</button>
  </form>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('static', filename='robot.js') }}"></script>
<script>
/* پس‌زمینه: محوطه پست — شبکه‌ای از فونداسیون‌های سیمی که آرام از کنار دوربین می‌گذرند */
(function(){
  const canvas = document.getElementById("bg");
  if (typeof THREE === "undefined") return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0F1821);
  scene.fog = new THREE.Fog(0x0F1821, 16, 52);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 120);
  camera.position.set(0, 7.5, 20);

  // شبکه زمین
  const grid = new THREE.GridHelper(120, 60, 0x27394A, 0x1B2836);
  grid.position.y = -0.02;
  scene.add(grid);

  const steel  = new THREE.LineBasicMaterial({color:0x4E7F9E, transparent:true, opacity:.55});
  const copper = new THREE.LineBasicMaterial({color:0xB4653A, transparent:true, opacity:.5});

  function wire(w,h,d,mat){
    return new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)), mat);
  }

  /** یک پی با ستون و میل مهار، سیمی */
  function unit(scale, hot){
    const g = new THREE.Group();
    const L = 2.0*scale, tf = .4*scale, b = .8*scale, hp = 1.0*scale;
    const pad = wire(L, tf, L, steel); pad.position.y = tf/2; g.add(pad);
    const ped = wire(b, hp, b, hot ? copper : steel); ped.position.y = tf + hp/2; g.add(ped);
    const pts = [];
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{
      pts.push(new THREE.Vector3(s[0]*b*.28, tf+hp, s[1]*b*.28));
      pts.push(new THREE.Vector3(s[0]*b*.28, tf+hp+.35*scale, s[1]*b*.28));
    });
    g.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(pts), hot ? copper : steel));
    return g;
  }

  const units = [];
  let n = 0;
  for (let row=-2; row<=2; row++){
    for (let col=-3; col<=3; col++){
      const s = 0.85 + ((row+col)%3)*0.16;
      const u = unit(s, (n % 11) === 0);
      u.position.set(col*7.5 + (row%2?2.4:0), 0, row*9 - 4);
      scene.add(u); units.push(u); n++;
    }
  }

  function resize(){
    const w = innerWidth, h = innerHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h,false);
  }
  addEventListener("resize", resize); resize();

  let t = 0;
  (function loop(){
    requestAnimationFrame(loop);
    if (!reduce){
      t += 0.0016;
      units.forEach(u => {
        u.position.z += 0.012;
        if (u.position.z > 26) u.position.z -= 52;
      });
      camera.position.x = Math.sin(t) * 3.2;
      camera.position.y = 7.5 + Math.sin(t*0.7) * 0.8;
    }
    camera.lookAt(0, 1.2, -2);
    renderer.render(scene, camera);
  })();
})();
</script>

<script>
/* ربات روی کادر: سرش دنبال ماوس می‌چرخد، موقع تایپ رمز چشم‌هایش را می‌پوشاند */
(function(){
  const canvas = document.getElementById("robot");
  if (typeof LoginRobot === "undefined" || !canvas) return;
  const bot = new LoginRobot(canvas);
  if (!bot.renderer) return;

  addEventListener("pointermove", e => bot.pointTo(e.clientX, e.clientY));
  addEventListener("pointerleave", () => { bot.target.x = 0; bot.target.y = 0; });

  // کلیک روی ربات: هر بار یک واکنش — می‌پرد عقب، سر تکان می‌دهد، می‌چرخد یا دست تکان می‌دهد
  canvas.addEventListener("pointerdown", () => bot.react());
  canvas.addEventListener("keydown", e => { if (e.key === "Enter") bot.react(); });
  canvas.setAttribute("tabindex", "0");
  canvas.setAttribute("aria-label", "کاراکتر تزئینی — با کلیک واکنش نشان می‌دهد");

  const card = document.getElementById("card");
  card.addEventListener("pointerenter", () => bot.setLean(true));
  card.addEventListener("pointerleave", () => bot.setLean(false));

  const pass = card.querySelector('input[type=password]');
  pass.addEventListener("focus", () => bot.setShy(true));
  pass.addEventListener("blur",  () => bot.setShy(false));

  // روی موبایل: با لمس هر جای صفحه نگاه می‌کند
  addEventListener("touchmove", e => {
    const t = e.touches[0];
    if (t) bot.pointTo(t.clientX, t.clientY);
  }, {passive:true});
})();
</script>
</body>
</html>
